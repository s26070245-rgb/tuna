<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four AI</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #111827;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --red: #f87171;
        --yellow: #facc15;
        --blue: #60a5fa;
        --board: #1d4ed8;
        --cell: #0f172a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, #172554, var(--bg1) 40%, var(--bg2));
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: min(92vw, 760px);
        aspect-ratio: 1.12;
        display: grid;
        place-items: center;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 3;
        min-width: min(260px, 40vw);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 2rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 1rem;
      }

      .status span {
        color: var(--text);
        font-weight: 700;
      }

      .legend {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }

      .dot.red { background: var(--red); }
      .dot.yellow { background: var(--yellow); }

      #board {
        width: min(84vw, 620px);
        aspect-ratio: 7 / 6;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.6rem;
        padding: 0.9rem;
        background: linear-gradient(180deg, #1d4ed8, #1e3a8a);
        border-radius: 24px;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.55), inset 0 0 0 3px rgba(255,255,255,0.12);
        border: 1px solid rgba(191, 219, 254, 0.2);
      }

      .cell {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--cell);
        border: none;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        box-shadow: inset 0 10px 18px rgba(15, 23, 42, 0.9);
      }

      .cell:hover {
        transform: translateY(-1px);
      }

      .cell::before {
        content: "";
        position: absolute;
        inset: 14%;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .cell.hovered::before {
        opacity: 1;
      }

      .cell.red {
        background: linear-gradient(135deg, #f87171, #ef4444);
        box-shadow: inset 0 8px 12px rgba(255,255,255,0.25), inset 0 -8px 16px rgba(127,29,29,0.28), 0 0 18px rgba(248,113,113,0.38);
      }

      .cell.yellow {
        background: linear-gradient(135deg, #facc15, #eab308);
        box-shadow: inset 0 8px 12px rgba(255,255,255,0.28), inset 0 -8px 16px rgba(133,77,14,0.25), 0 0 18px rgba(250,204,21,0.32);
      }

      .controls {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--blue), #3b82f6);
        color: white;
        font-weight: 700;
        padding: 12px 18px;
        font-size: 0.98rem;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.35);
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      button.secondary {
        background: linear-gradient(135deg, #334155, #475569);
        box-shadow: none;
      }

      @media (max-width: 700px) {
        .hud {
          top: 12px;
          left: 12px;
          right: 12px;
          min-width: auto;
        }

        #board {
          width: min(88vw, 560px);
        }

        .controls {
          left: 12px;
          right: 12px;
          justify-content: space-between;
        }

        button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <h1>Connect Four</h1>
        <div class="status">Status: <span id="turnStatus">Your turn</span></div>
        <div class="legend">
          <span><i class="dot red"></i>You</span>
          <span><i class="dot yellow"></i>AI</span>
        </div>
      </div>

      <div id="board" aria-label="Connect Four board"></div>

      <div class="controls">
        <button id="restartBtn">Restart</button>
        <button id="swapBtn" class="secondary">AI starts</button>
      </div>
    </div>

    <script>
      const ROWS = 6;
      const COLS = 7;
      const EMPTY = 0;
      const HUMAN = 1;
      const AI = 2;
      const WIN_LENGTH = 4;

      let board = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
      let currentPlayer = HUMAN;
      let gameOver = false;
      let aiStarts = false;
      let hoveredColumn = null;

      const boardEl = document.getElementById('board');
      const turnStatus = document.getElementById('turnStatus');
      const restartBtn = document.getElementById('restartBtn');
      const swapBtn = document.getElementById('swapBtn');

      function buildBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'cell';
            cell.dataset.row = String(row);
            cell.dataset.col = String(col);
            cell.setAttribute('aria-label', `Column ${col + 1}, row ${row + 1}`);
            cell.addEventListener('mouseenter', () => {
              if (!gameOver && currentPlayer === HUMAN) {
                hoveredColumn = col;
                updateColumnHover();
              }
            });
            cell.addEventListener('mouseleave', () => {
              if (hoveredColumn === col) {
                hoveredColumn = null;
                updateColumnHover();
              }
            });
            cell.addEventListener('click', () => handleHumanMove(col));
            boardEl.appendChild(cell);
          }
        }
      }

      function renderBoard() {
        const cells = [...boardEl.children];
        cells.forEach((cell) => {
          const row = Number(cell.dataset.row);
          const col = Number(cell.dataset.col);
          const value = board[row][col];
          cell.classList.remove('red', 'yellow', 'hovered');
          if (value === HUMAN) cell.classList.add('red');
          if (value === AI) cell.classList.add('yellow');
          if (hoveredColumn === col && !gameOver && currentPlayer === HUMAN) {
            cell.classList.add('hovered');
          }
        });
      }

      function updateColumnHover() {
        const cells = [...boardEl.children];
        cells.forEach((cell) => {
          const col = Number(cell.dataset.col);
          cell.classList.toggle('hovered', hoveredColumn === col && !gameOver && currentPlayer === HUMAN);
        });
      }

      function updateStatus() {
        if (gameOver) return;
        turnStatus.textContent = currentPlayer === HUMAN ? 'Your turn' : 'AI is thinking...';
      }

      function isValidMove(col) {
        return col >= 0 && col < COLS && board[0][col] === EMPTY;
      }

      function getOpenRow(col) {
        for (let row = ROWS - 1; row >= 0; row--) {
          if (board[row][col] === EMPTY) return row;
        }
        return -1;
      }

      function dropDisc(col, player) {
        const row = getOpenRow(col);
        if (row === -1) return -1;
        board[row][col] = player;
        return row;
      }

      function checkWinner(row, col, player) {
        const directions = [
          [0, 1],
          [1, 0],
          [1, 1],
          [1, -1]
        ];

        for (const [dx, dy] of directions) {
          let count = 1;
          count += countDirection(row, col, dx, dy, player);
          count += countDirection(row, col, -dx, -dy, player);
          if (count >= WIN_LENGTH) return true;
        }
        return false;
      }

      function countDirection(row, col, dx, dy, player) {
        let count = 0;
        let r = row + dy;
        let c = col + dx;

        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
          count++;
          r += dy;
          c += dx;
        }
        return count;
      }

      function isBoardFull() {
        return board[0].every(cell => cell !== EMPTY);
      }

      function finishGame(message) {
        gameOver = true;
        turnStatus.textContent = message;
      }

      function makeMove(col, player) {
        if (gameOver || !isValidMove(col)) return false;

        const row = dropDisc(col, player);
        if (row === -1) return false;

        renderBoard();

        if (checkWinner(row, col, player)) {
          finishGame(player === HUMAN ? 'You win!' : 'AI wins!');
          return true;
        }

        if (isBoardFull()) {
          finishGame('Draw!');
          return true;
        }

        currentPlayer = player === HUMAN ? AI : HUMAN;
        updateStatus();
        return true;
      }

      function handleHumanMove(col) {
        if (gameOver || currentPlayer !== HUMAN) return;
        if (!makeMove(col, HUMAN)) return;

        if (!gameOver && currentPlayer === AI) {
          setTimeout(() => {
            if (!gameOver) {
              const aiMove = chooseBestMove();
              makeMove(aiMove, AI);
            }
          }, 300);
        }
      }

      function evaluateWindow(window) {
        const aiCount = window.filter(v => v === AI).length;
        const humanCount = window.filter(v => v === HUMAN).length;
        const emptyCount = window.filter(v => v === EMPTY).length;

        if (aiCount > 0 && humanCount > 0) return 0;
        if (aiCount === 4) return 100000;
        if (aiCount === 3 && emptyCount === 1) return 120;
        if (aiCount === 2 && emptyCount === 2) return 18;
        if (humanCount === 4) return -100000;
        if (humanCount === 3 && emptyCount === 1) return -140;
        if (humanCount === 2 && emptyCount === 2) return -20;
        return 0;
      }

      function evaluateBoard(state) {
        let score = 0;

        const center = state.map(row => row[3]).filter(v => v === AI).length;
        score += center * 6;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c <= COLS - WIN_LENGTH; c++) {
            const window = [];
            for (let i = 0; i < WIN_LENGTH; i++) window.push(state[r][c + i]);
            score += evaluateWindow(window);
          }
        }

        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r <= ROWS - WIN_LENGTH; r++) {
            const window = [];
            for (let i = 0; i < WIN_LENGTH; i++) window.push(state[r + i][c]);
            score += evaluateWindow(window);
          }
        }

        for (let r = 0; r <= ROWS - WIN_LENGTH; r++) {
          for (let c = 0; c <= COLS - WIN_LENGTH; c++) {
            const window = [];
            for (let i = 0; i < WIN_LENGTH; i++) window.push(state[r + i][c + i]);
            score += evaluateWindow(window);
          }
        }

        for (let r = 0; r <= ROWS - WIN_LENGTH; r++) {
          for (let c = WIN_LENGTH - 1; c < COLS; c++) {
            const window = [];
            for (let i = 0; i < WIN_LENGTH; i++) window.push(state[r + i][c - i]);
            score += evaluateWindow(window);
          }
        }

        return score;
      }

      function isWinner(state, player) {
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            if (state[row][col] !== player) continue;
            for (const [dx, dy] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
              let count = 1;
              for (let i = 1; i < WIN_LENGTH; i++) {
                const r = row + dy * i;
                const c = col + dx * i;
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS || state[r][c] !== player) break;
                count++;
              }
              if (count >= WIN_LENGTH) return true;
            }
          }
        }
        return false;
      }

      function cloneBoard(state) {
        return state.map(row => [...row]);
      }

      function getValidMoves(state) {
        const moves = [];
        for (let col = 0; col < COLS; col++) {
          if (state[0][col] === EMPTY) moves.push(col);
        }
        return moves;
      }

      function getLowestOpenRow(state, col) {
        for (let row = ROWS - 1; row >= 0; row--) {
          if (state[row][col] === EMPTY) return row;
        }
        return -1;
      }

      function minimax(state, depth, alpha, beta, isMaximizing) {
        if (isWinner(state, AI)) return 100000 + depth;
        if (isWinner(state, HUMAN)) return -100000 - depth;
        if (state[0].every(cell => cell !== EMPTY) || depth === 0) return evaluateBoard(state);

        if (isMaximizing) {
          let best = -Infinity;
          for (const col of getValidMoves(state)) {
            const next = cloneBoard(state);
            const row = getLowestOpenRow(next, col);
            next[row][col] = AI;
            const score = minimax(next, depth - 1, alpha, beta, false);
            best = Math.max(best, score);
            alpha = Math.max(alpha, score);
            if (beta <= alpha) break;
          }
          return best;
        }

        let best = Infinity;
        for (const col of getValidMoves(state)) {
          const next = cloneBoard(state);
          const row = getLowestOpenRow(next, col);
          next[row][col] = HUMAN;
          const score = minimax(next, depth - 1, alpha, beta, true);
          best = Math.min(best, score);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return best;
      }

      function chooseBestMove() {
        let bestScore = -Infinity;
        let bestMove = 3;

        for (const col of getValidMoves(board)) {
          const next = cloneBoard(board);
          const row = getLowestOpenRow(next, col);
          next[row][col] = AI;
          const score = minimax(next, 5, -Infinity, Infinity, false);
          if (score > bestScore) {
            bestScore = score;
            bestMove = col;
          }
        }

        return bestMove;
      }

      function resetGame() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
        currentPlayer = HUMAN;
        gameOver = false;
        hoveredColumn = null;
        renderBoard();
        updateStatus();

        if (aiStarts) {
          currentPlayer = AI;
          turnStatus.textContent = 'AI is thinking...';
          setTimeout(() => {
            if (!gameOver) {
              const aiMove = chooseBestMove();
              makeMove(aiMove, AI);
            }
          }, 450);
        }
      }

      restartBtn.addEventListener('click', () => resetGame());
      swapBtn.addEventListener('click', () => {
        aiStarts = !aiStarts;
        swapBtn.textContent = aiStarts ? 'Player starts' : 'AI starts';
        resetGame();
      });

      buildBoard();
      renderBoard();
      updateStatus();
    </script>
  </body>
</html>
